<script>
// Define dataLayer and the gtag function.
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}

// Default ad_storage to 'denied' as a placeholder
// Determine actual values based on your own requirements
gtag('consent', 'default', {
  'ad_storage': 'denied',
  'analytics_storage': 'denied'
});
</script>

<!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src='https://www.googletagmanager.com/gtag/js?id=G-Z967JJVQQX'></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    gtag('js', new Date());

  gtag('config', 'G-Z967JJVQQX');

/*
The custom trackers below can be tailored to match the inputs used in your
dashboard.
*/

/*
This one captures clicks on the top level service navigation component.
*/
   $(document).on('click', 'ul#navigation', function(e) {
    gtag(
      'event', 
      'Service navigation', 
      {
        'event_category' : 'Top level navigation',
        'event_label' : e.target.closest('li').querySelector('a').getAttribute('id')
      });
    });

  $(document).on('change', 'select#selectPhase', function(e) {
    gtag('event', 'Select phase', {'event_category' : 'User input',
    'event_label' : document.querySelector('select#selectPhase').value
    });
  });

  $(document).on('change', 'select#selectArea', function(e) {
    gtag('event', 'Select area', {'event_category' : 'Geographic input',
    'event_label' : document.querySelector('select#selectArea').value
    });
  });

  $(document).on(
    'click', 'ul#tabsetpanels', function(e) {
      gtag(
        'event', 
        'Example page tabset click', 
        {
          'event_category' : 'Mid level navigation',
          'event_label' : document.querySelector(
            'ul#tabsetpanels > li > a.active'
          ).getAttribute('data-value')
        }
      );
    }
  );


  $(document).on('click', 'a#download_data', function(e) {
    gtag(
      'event', 
      'Download button', 
      {
        'event_category' : 'Download button click'
    }
  );
  });

  $(document).on('shiny:disconnected', function(e) {
    gtag('event', 'disconnect', {
      'event_label' : 'Disconnect',
      'event_category' : 'Disconnect'
    });
  });

</script>
