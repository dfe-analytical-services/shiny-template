name: DfE Shiny Template

pool:
  name: RSConnect

trigger:
  branches:
    include:
    - main # this needs to be either main OR master depending on what your project uses
  paths:
    exclude:
    - azure-pipelines.yml

resources:
  repositories:
    - repository: posit-deploy
      type: git
      name: ESFA-Data-Science/posit-deploy

extends:
  template: deploy.yml@posit-deploy
  parameters:
    appName: Shiny-App # this will need replacing
    environments:
    - name: Pre-Production
      appId: none # this will need replacing if updating an existing app pipeline
    - name: Production
      appId: none # this will need replacing if updating an existing app pipeline
    approvers: | # these will need replacing - can be left empty
      approver@education.gov.uk
      another.approver@education.gov.uk